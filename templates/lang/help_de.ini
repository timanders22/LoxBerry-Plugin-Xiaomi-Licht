; Hilfetexte, deutsch. Gehoert zu templates/help/help.html. LBWeb::gethelp() sucht diese Datei in templates/lang/.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine; Auszeichnung bleibt roh.

[HILFE]
K01 = "Xiaomi Licht"
K02 = "Bindet Deckenleuchten von Xiaomi und Yeelight an Loxone an und meldet den <b>echten Zustand</b> zurück - auch wenn jemand die Lampe über die App, Alexa oder den Wandschalter verändert. Werte über das MQTT-Gateway V2, Befehle über die Befehlsbrücke."
K03 = "Zwei Wege zur Lampe"
K04 = "<b>miIO</b> (UDP 54321) mit dem Token der Lampe: lesen und schalten, für jede Mi-Home-Lampe. Ohne Push - das Plugin fragt im Takt ab (Werk 10 s)."
K05 = "<b>Yeelight-LAN</b> (TCP 55443): die Lampe meldet jede Änderung sofort. Nur wenn in der <i>Yeelight-App</i> die „LAN-Steuerung“ eingeschaltet ist - nicht jedes Modell kann das (im Haus belegt nur bei der Yeelight-Deckenleuchte ceiling3)."
K06 = "So gehen Sie vor"
K07 = "<b>Einstellungen:</b> je Lampe Adresse eintragen (oder „Lampen im Heimnetz suchen“) und den Token von Hand oder über „Token aus der Xiaomi-Cloud holen“ - speichern. Aus der Cloud kommen mit einer Anmeldung alle Lampen auf einmal: angehakt sind die, die die Cloud als online meldet, dann „Ausgewählte übernehmen“; schon eingetragene Lampen bekommen nur Token, Adresse und Modell neu. Danach grüßt das Plugin jede übernommene Lampe kurz und meldet, ob sie antwortet und ob der Token passt - so fallen alte Cloud-Einträge sofort auf."
K08 = "<b>Dienst starten.</b>"
K09 = "<b>Test:</b> je Lampe Gruß, Token, Modell, Yeelight-LAN und Fähigkeiten prüfen."
K10 = "<b>MQTT:</b> unter Gateway V2 die Datenpunkte der Hakenliste anhaken, Lebenszeichen und ok mit „Noncached“."
K11 = "<b>Einbindung in Loxone:</b> Virtuelle Eingänge nach der Namenstabelle, Baustein-Liste der Musterprojekt-Seiten „Xiaomi Licht“ und „Xiaomi Licht Steuerung“."
K12 = "Befehle aus Loxone"
K13 = "Ab Werk beobachtet das Plugin nur (Stufe A). Schalten, dimmen, Farbtemperatur, Nachtlicht und Szenen gehen erst mit zwei Haken: „Befehle über MQTT annehmen“ (Reiter MQTT) und „Lampen aus Loxone schalten“ (Reiter Einstellungen). Die Befehle sind noch nicht am Gerät erprobt."
K14 = "Was das Plugin nicht kann"
K15 = "Ist die Lampe stromlos (Wandschalter, Loxone-Ausgang aus), kann sie nicht antworten: das Plugin meldet „nicht erreichbar“ und für alle Werte -1. Ein Befehl über das Plugin wirkt nur, solange die Lampe Strom hat. Eine WLAN-Lampe hinter einem Phasendimmer kann flackern oder neu starten."
K16 = "Modelle: Tabellen für yeelink.light.ceiling3 und yilai.light.ceiling1 aus der amtlichen MIoT-Spezifikation; andere Modelle in der Grundform (schalten, Helligkeit) mit Warnung. Noch nicht am Gerät gemessen."
K17 = "Datenschutz"
K18 = "Token der Lampen und das Kennwort des Mi-Kontos stehen nie im Protokoll und nie auf der Seite. Das Kennwort wird nie gespeichert; die Token liegen geschützt in der Konfiguration und in der Sicherung (wie ein Passwort behandeln)."
