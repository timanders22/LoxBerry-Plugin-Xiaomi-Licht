SEITE_1 = "Xiaomi Licht"
S1_01 = "1 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_status_zaehler | Heartbeat of the lamp service, 0 to 999 – counts up by one every 30 seconds (never retained; tick as data point with “Noncached” in the plugin, MQTT tab) as long as LoxBerry, service and MQTT gateway are running | —"
S1_02 = "2 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_status_ok | 1 = the service is running and at least one entered lamp answers, 0 = no lamp reachable (never retained; tick “Noncached”) | —"
S1_03 = "3 | Constant | Constant 1 | Value 1 | —"
S1_04 = "4 | Analog value validation | Heartbeat missing (Xiaomi Light) | Tmc 120 s (four heartbeats of 30 s), Min 0, Max 999 – if the LoxBerry, the service or the MQTT gateway stops, the heartbeat stands still; remove the tick at ‘En’ in the properties window | V = #1, En = #3"
S1_05 = "5 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_erreichbar | 1 = lamp 1 answers or its feedback connection is up, 0 = not reachable – no power (wall switch or Loxone output off) or not on Wi-Fi (never retained) | —"
S1_06 = "6 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_ein | 1 = on, 0 = off – also when someone switched the lamp via the app, Alexa or the remote; -1 = no statement (lamp not reachable) | —"
S1_07 = "7 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_hell | Brightness in percent (1 to 100; in night light mode the brightness of the night light); -1 = no statement | —"
S1_08 = "8 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_ct | Colour temperature in K (2700 to 6500); -1 = no statement or the lamp has no adjustable colour temperature | —"
S1_09 = "9 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_modus | 0 = daylight, 1 = night light; -1 = no statement or the lamp has no night light | —"
S1_10 = "10 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_weg | how the plugin learns the state: 2 = the lamp reports every change immediately (Yeelight LAN), 1 = polling every 10 seconds (miIO), 0 = not at all (never retained) | —"
S1_11 = "11 | NOT | Lamp 1 not reachable (Xiaomi Light) | — | I = #5"
S1_12 = "12 | OR | Fault (Xiaomi Light) | — (lamp 1 not reachable or heartbeat missing) | I1 = #11, I2 = output E of #4"
S1_13 = "13 | On-delay | Fault confirmed (Xiaomi Light) | 600 s (a short off at the wall switch or a restart of the lamp or the service reports nothing) | Input = #12"
S1_14 = "14 | Notification | Message plugin fault (Xiaomi Light) | optional – do not connect as long as Loxone switches the lamp via its power supply (then “not reachable” is normal when the lamp is off); text: Xiaomi Light – no answer for 10 minutes: lamp 1 has no power or is not on Wi-Fi, or the LoxBerry, the lamp service or the MQTT gateway is stuck. Read the status “State (Xiaomi Light)” in the app | Input = #13"
S1_15 = "15 | Status | State (Xiaomi Light) | Lines: V1 = 1 “heartbeat missing for at least 2 minutes – LoxBerry, lamp service or MQTT gateway is stuck; in the plugin Settings tab ‘Start service’, check the MQTT tab”; V4 = 0 “no entered lamp answers – all without power or not on Wi-Fi, or no lamp entered in the plugin; check the Test tab in the plugin”; V2 = 0 “lamp 1 not reachable – no power (wall switch or Loxone output off) or not on Wi-Fi; check the Test tab in the plugin”; V3 = 2 “OK – lamp 1 reports every change immediately”; V3 = 1 “OK – lamp 1 is polled every 10 seconds (a change via the app shows up after at most 10 seconds)”; without condition “unknown – no value from the plugin yet” | V1 = output E of #4, V2 = #5, V3 = #10, V4 = #2"
S1_16 = "16 | Status | Lamp 1 (Xiaomi Light) | Lines: V5 = 0 “unknown – lamp 1 not reachable (status ‘State (Xiaomi Light)’)”; V1 = -1 “unknown – the lamp makes no statement”; V1 = 0 “off”; V4 = 1 “on – night light, brightness <v2> %”; V3 > 0 “on – <v3> K, brightness <v2> %”; without condition “on – brightness <v2> %”; visualisation ON | V1 = #6, V2 = #7, V3 = #8, V4 = #9, V5 = #5"
S1_17 = "17 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_status_befehle | 1 = the command bridge of the plugin is running and accepts xiaomilicht/befehl/…; 0 = “Accept commands via MQTT” is off in the plugin; -1 = should run and is stuck | —"
S1_18 = "18 | Status | Command path (Xiaomi Light) | Lines: V1 = -1 “command bridge of the plugin is stuck – check the Test tab in the plugin”; V1 = 0 “commands via MQTT are off in the plugin – the page ‘Xiaomi Licht Steuerung’ has no effect; tick ‘Accept commands via MQTT’ in the plugin, MQTT tab”; without condition “commands via MQTT are accepted; switching only with the tick ‘Switch lamps from Loxone’ (Settings tab)” | V1 = #17"
SEITE_2 = "Xiaomi Licht Steuerung"
S2_01 = "1 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_ein | further instance of the same input as on page “Xiaomi Licht” #6 – do not create anew; 1 = on, 0 = off, -1 = no statement | —"
S2_02 = "2 | Virtual input (name as assigned by the MQTT gateway, plugin Xiaomi Light) | xiaomilicht_lampe1_hell | further instance of the same input as on page “Xiaomi Licht” #7 – do not create anew; brightness 1 to 100 percent, -1 = no statement | —"
S2_03 = "3 | Formula | Brightness for the dimmer (Xiaomi Light) | IF(I2=1;I1;0) – on: the reported brightness, off or no statement: 0 | I1 = #2, I2 = #1"
S2_04 = "4 | Dimmer | Ceiling light (Xiaomi Light) | Min 0, Max 100; switchable and dimmable in the app; Set takes over the real state of the lamp (also after a change via the app or Alexa) | Set = #3"
S2_05 = "5 | Virtual output command (template “LoxBerry MQTT-Gateway”) | Xiaomi Light: lamp 1 brightness | Command on analog value: publish xiaomilicht/befehl/lampe1/hell <v.0> (never retain); 0 = off, 1 to 100 = on with this brightness; the plugin answers the same value after Set with “unchanged”; goes via the LoxBerry: needs the running service and in the plugin the ticks “Accept commands via MQTT” (MQTT tab) and “Switch lamps from Loxone” (Settings tab) | Input = output AQ of #4"
S2_06 = "6 | Virtual input (slider) | Colour temperature (Xiaomi Light) | Min 2700, Max 6500, step 100, start value 4000 (K) | —"
S2_07 = "7 | Virtual output command (template “LoxBerry MQTT-Gateway”) | Xiaomi Light: lamp 1 colour temperature | Command on analog value: publish xiaomilicht/befehl/lampe1/ct <v.0> (never retain); white light in K; needs the same ticks as #5 | Input = #6"
S2_08 = "8 | Virtual input (push button) | Button night light (Xiaomi Light) | in the app | —"
S2_09 = "9 | Virtual output command (template “LoxBerry MQTT-Gateway”) | Xiaomi Light: lamp 1 night light | Command on ON: publish xiaomilicht/befehl/lampe1/nacht 1 (never retain); only lamps with night light (e.g. Yeelight ceiling3) – otherwise the plugin acknowledges “abgelehnt: NICHT_UNTERSTUETZT” | Input = #8"
S2_10 = "10 | Virtual input (push button) | Button daylight (Xiaomi Light) | in the app | —"
S2_11 = "11 | Virtual output command (template “LoxBerry MQTT-Gateway”) | Xiaomi Light: lamp 1 daylight | Command on ON: publish xiaomilicht/befehl/lampe1/nacht 0 (never retain); from night light back to normal light | Input = #10"
S2_12 = "12 | Virtual input (push button) | Button reading (Xiaomi Light) | in the app | —"
S2_13 = "13 | Virtual output command (template “LoxBerry MQTT-Gateway”) | Xiaomi Light: lamp 1 scene reading | Command on ON: publish xiaomilicht/befehl/lampe1/szene lesen (never retain); on, 100 %, 4000 K | Input = #12"
S2_14 = "14 | Virtual input (push button) | Button cosy (Xiaomi Light) | in the app | —"
S2_15 = "15 | Virtual output command (template “LoxBerry MQTT-Gateway”) | Xiaomi Light: lamp 1 scene cosy | Command on ON: publish xiaomilicht/befehl/lampe1/szene gemuetlich (never retain); on, 30 %, 2700 K | Input = #14"

