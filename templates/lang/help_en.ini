; Help texts, English. Belongs to templates/help/help.html. LBWeb::gethelp() looks for this file in templates/lang/.
; Every value is in double quotes and contains none itself; markup stays raw.

[HILFE]
K01 = "Xiaomi Light"
K02 = "Connects ceiling lights from Xiaomi and Yeelight to Loxone and reports the <b>real state</b> back - also when someone changes the lamp via the app, Alexa or the wall switch. Values via the MQTT gateway V2, commands via the command bridge."
K03 = "Two routes to the lamp"
K04 = "<b>miIO</b> (UDP 54321) with the token of the lamp: read and switch, for every Mi Home lamp. Without push - the plugin polls at an interval (default 10 s)."
K05 = "<b>Yeelight LAN</b> (TCP 55443): the lamp reports every change immediately. Only if “LAN control” is switched on in the <i>Yeelight app</i> - not every model supports it."
K06 = "How to proceed"
K07 = "<b>Settings:</b> enter the address of each lamp (or use “Search lamps in the home network”) and the token by hand or via “Fetch tokens from the Xiaomi cloud” - save. One sign-in to the cloud brings all lamps at once: the ones the cloud reports as online are ticked, then press “Take over selected”; lamps already entered only get token, address and model refreshed. Afterwards the plugin greets every lamp taken over briefly and reports whether it answers and whether the token fits - so old cloud entries show up at once."
K08 = "<b>Start the service.</b>"
K09 = "<b>Test:</b> check hello, token, model, Yeelight LAN and capabilities per lamp."
K10 = "<b>MQTT:</b> under gateway V2 tick the data points of the list, heartbeat and ok with “Noncached”."
K11 = "<b>Loxone integration:</b> virtual inputs according to the name table, block list of the sample project pages “Xiaomi Licht” and “Xiaomi Licht Steuerung”."
K12 = "Commands from Loxone"
K13 = "By default the plugin only observes (stage A). Switching, dimming, colour temperature, night light and scenes only work with two ticks: “Accept commands via MQTT” (MQTT tab) and “Switch lamps from Loxone” (Settings tab). The commands have not yet been tried on the device."
K14 = "What the plugin cannot do"
K15 = "If the lamp has no power (wall switch, Loxone output off) it cannot answer: the plugin reports “not reachable” and -1 for all values. A command via the plugin only works while the lamp has power. A Wi-Fi lamp behind a phase dimmer may flicker or restart."
K16 = "Models: tables for yeelink.light.ceiling3 and yilai.light.ceiling1 from the official MIoT specification; other models in the basic form (switch, brightness) with a warning. Not yet measured on the device."
K17 = "Privacy"
K18 = "Lamp tokens and the password of the Mi account never appear in the log or on the page. The password is never stored; the tokens are kept protected in the configuration and in the backup (treat it like a password)."
