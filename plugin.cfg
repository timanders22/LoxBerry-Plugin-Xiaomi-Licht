[AUTHOR]
NAME=Xiaomi Licht Plugin Authors
EMAIL=xiaomilicht@users.noreply.github.com

[PLUGIN]
VERSION=0.9.2
NAME=xiaomilicht
FOLDER=xiaomilicht
TITLE=Xiaomi Licht

[AUTOUPDATE]
# Die Adressen zeigen ausschliesslich auf das eigene Repository dieses Plugins. Auf ein FREMDES Repository duerfen sie
# nie zeigen: LoxBerry vergleicht Fassungen als Zahl, ein fremdes 2021.05.14 waere groesser als 0.9.1.
#
# Das Repository timanders22/LoxBerry-Plugin-Xiaomi-Licht besteht seit 28.10.2026.
#
# Bei jedem weiteren Release: VERSION hier UND in release.cfg erhoehen, beide Adressen dort auf den neuen Tag setzen,
# das Release mit genau diesem Tag anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Xiaomi-Licht/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Xiaomi-Licht/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Mindestens 3.0.0: das Plugin liest config/system/general.json (MQTT-Gateway).
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl ruft bei Ueberschreitung &fail() - die Installation wird abgebrochen.
LB_MAXIMUM=false
# Reines PHP, laeuft ueberall - eine Angabe waere eine unwahre Aussage.
ARCHITECTURE=false
