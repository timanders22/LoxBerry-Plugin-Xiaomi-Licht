[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert dort das Auto-Update. Eine release.cfg
# ohne VERSION-Zeile waere der schlechteste Fall.
#
# Bei jedem Release drei Stellen gleichzeitig anfassen:
#   1. plugin.cfg  -> VERSION
#   2. release.cfg -> VERSION und BEIDE Adressen auf den neuen Tag
#   3. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
# Die plugin.cfg liest DIESE Datei aus dem ZWEIG main, ARCHIVEURL zieht aus dem TAG.
#
# Stand 0.9.1: das Repository entsteht erst nach dem Geraetetest und der Freigabe (Entscheidung 5) - bis dahin 404.

VERSION=0.9.1
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Xiaomi-Licht/archive/refs/tags/v0.9.1.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Xiaomi-Licht/releases/tag/v0.9.1
